<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giỏ hàng</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class = "navbar">
        <div class = "logo">
            <a href="index.html">
                <img src="images/logo.jpg">
            </a>
        </div>

         <div class = "TenShop">
            <h1>LUNARE</h1>
        </div>

        <div class = "search-bar">
            <input type = "text" placeholder = "Tìm kiếm sản phẩm...">
            <button type = "submit">Tìm kiếm</button>
        </div>

        <nav>
            <a href = "index.html">Trang chủ</a>
            <a href = "cart.html">Giỏ hàng</a>
            <a href = "login.html">Đăng nhập</a>
            <a href="register.html">Đăng ký</a>
        </nav>
    </header>

    <div class="banner">
        <img src="images/banner.jpg" alt="Tri ân ngày nhà giáo Việt Nam 20/11">
    </div>


    <main class = "cart-container">
        <h1>Giỏ hàng</h1>
        <div class = "cart-wrapper">
            <div class = "cart-item">
                <img src = "images/product1.jpg" alt = "Product 1">
                <div class = "item-details">
                    <div class = "item-header">
                        <h2>Áo khoác</h2>
                        <p>Giá: 100.000 VNĐ</p>
                    </div>
                    
                    <div class = "quantity-box">
                        <input type = "number" id = "quantity1" min = "1" value = "1">
                    </div>
                    
                    <div class = "item-footer">
                        <p>Tổng: 100.000 VNĐ</p>
                        <button class = "delete-button">Xóa</button>
                    </div>

                </div>
            </div>

            <div class = "cart-item">
                <img src = "images/product2.jpg" alt = "Product 2">
                <div class = "item-details">
                    <div class = "item-header">
                        <h2>Cardigan</h2>
                        <p>Giá: 100.000 VNĐ</p>
                    </div>

                    <div class = "quantity-box">
                        <input type = "number" id = "quantity2" min = "1" value = "1">
                    </div>

                    <div class = "item-footer">
                        <p>Tổng: 100.000 VNĐ</p>
                        <button class = "delete-button">Xóa</button>
                    </div>
                </div>
            </div>

            <div class = "cart-item">
                <img src = "images/product3.jpg" alt = "Product 3">
                <div class = "item-details">
                    <div class = "item-header">
                        <h2>Cardigan</h2>
                        <p>Giá: 100.000 VNĐ</p>
                    </div>
                    
                    <div class = "quantity-box">
                        <input type = "number" id = "quantity3" min = "1" value = "1">
                    </div>
                    
                    <div class = "item-footer">
                        <p>Tổng: 100.000 VNĐ</p>
                        <button class = "delete-button">Xóa</button>
                    </div>

                </div>
            </div>

        </div>

        

        <div class = "cart-summary">
            <div class = "summary-box">
                <div class = "summary-header">
                    <h2>Tổng đơn hàng</h2>
                    <p>3 Sản phẩm</p>
                </div>

                <div class = "summary-footer">
                    <p>Tổng tiền: 300.000 VNĐ</p>
                    <button class = "checkout-button">Thanh toán</button>
                </div>

            </div>
        </div>
        
        <div class="cart-actions">
                <a href="index.html" class="continue-shopping">← Tiếp tục mua sắm</a>
        </div>

        
    </main>
</body>
</html>
