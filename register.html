<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang đăng nhập</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <div class="login-container">
        <div class="image-container">
            <img src="logo3.png" class="register-image">
        </div>

        <div class="register-form-container">
            <form>
            <h1 class="register-title">Đăng ký tài khoản</h1>
            <div class="input-container">
                <label> Họ và tên </label>
                <input class="register-input" type="text, email" required>
                <br>
            </div>
        
            <div class="input-container">
                <label> Email </label>
                <input class="register-input" type="email" minlength="8" required>
                <br>
            </div>
            <div class="input-container">
                <label> Mật khẩu </label>
                <input class="register-input" type="password" minlength="8" required>
                <br>
            </div>
            <div class="input-container">
                <label> Xác nhận mật khẩu </label>
                <input class="register-input" type="password" minlength="8" required>
                <br>
            </div>

        <div class="button-container">
                <button class="register-button" type="submit">
                    Đăng ký
                </button>
        </div>
            
            </form>
        </div>
    </div>
</body>
</html>
