<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang đăng nhập</title>
    <link rel="stylesheet" href="css/nháp.css">
</head>
<body>
    <div class="login-container">
        <div class="image-container">
            <img src="images/logo.jpg" class="login-image">
        </div>

        <div class="login-form-container">
            <form>
            <h1 class="login-title">Đăng nhập tài khoản</h1>
            <div class="input-container">
                <label> Email/Tên đăng nhập </label>
                <input class="login-input" type="email" required>
                <br>
            </div>
        
            <div class="input-container">
                <label> Mật khẩu </label>
                <input class="login-input" type="password" minlength="8" required>
                <br>
            </div>

        <div class="button-container">
                <button class="login-button" type="submit">
                    Đăng nhập
                </button>
        </div>
            <div class="button-container">
                <a href="register.html">
                    <button class="register-button" type="submit">
                        Tôi chưa có tài khoản
                    </button>
                </a>
            </div>
            </form>
        </div>
    </div>
</body>
</html>
